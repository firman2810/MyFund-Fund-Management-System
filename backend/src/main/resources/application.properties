spring.application.name=myfund
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/myfund}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:28800000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Hyperledger Fabric network from smart-contract/network.sh (crypto material is generated there, git-ignored).
# Paths are relative to backend/, where the app is started. Override with env vars, e.g. FABRIC_CRYPTOPATH.
fabric.crypto-path=../smart-contract/network/organizations
fabric.channel=myfund-channel
fabric.chaincode=fund_cc
fabric.endpoint.ministry=localhost:7051
fabric.endpoint.agency=localhost:9051
fabric.endpoint.auditor=localhost:11051
