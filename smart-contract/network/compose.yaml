# MyFund Fabric network: 3 Raft orderers + one peer per org. Start it with ../network.sh up.
# Image tag is pinned here and in network.sh (TOOLS_IMAGE); change both together.
name: myfund

x-orderer: &orderer
  image: hyperledger/fabric-orderer:2.5.16
  restart: unless-stopped
  networks: [fabric]
  environment: &orderer-env
    FABRIC_LOGGING_SPEC: INFO
    ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
    ORDERER_GENERAL_LOCALMSPID: OrdererMSP
    ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
    ORDERER_GENERAL_BOOTSTRAPMETHOD: none
    ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
    ORDERER_GENERAL_TLS_ENABLED: "true"
    ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
    ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
    ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
    ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
    ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
    ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
    ORDERER_ADMIN_TLS_ENABLED: "true"
    ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
    ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
    ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
    ORDERER_ADMIN_TLS_CLIENTAUTHREQUIRED: "true"
    ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"

x-peer: &peer
  image: hyperledger/fabric-peer:2.5.16
  restart: unless-stopped
  networks: [fabric]
  environment: &peer-env
    FABRIC_LOGGING_SPEC: INFO
    CORE_PEER_TLS_ENABLED: "true"
    CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
    CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
    CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
    CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
    CORE_PEER_PROFILE_ENABLED: "false"

x-fundcc: &fundcc
  image: myfund/fund-cc:1.0   # built from ../chaincode by network.sh
  restart: unless-stopped
  networks: [fabric]
  environment: &fundcc-env
    CHAINCODE_SERVER_ADDRESS: 0.0.0.0:9999
    CORE_PEER_TLS_ENABLED: "true"
    CORE_TLS_CLIENT_CERT_FILE: /tls/server.crt   # server mode reads these two
    CORE_TLS_CLIENT_KEY_FILE: /tls/server.key
    # The shim also builds an (unused) client TLS context from these, and reads them as base64 PEM.
    CORE_TLS_CLIENT_CERT_PATH: /tls/server.crt.b64
    CORE_TLS_CLIENT_KEY_PATH: /tls/server.key.b64
    CORE_PEER_TLS_ROOTCERT_FILE: /tls/ca.crt

services:
  orderer1.orderer.myfund.local:
    <<: *orderer
    container_name: orderer1.orderer.myfund.local
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
    ports: ["7050:7050", "7053:7053"]
    volumes:
      - ./organizations/ordererOrganizations/orderer.myfund.local/orderers/orderer1.orderer.myfund.local/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/orderer.myfund.local/orderers/orderer1.orderer.myfund.local/tls:/var/hyperledger/orderer/tls
      - orderer1:/var/hyperledger/production/orderer

  orderer2.orderer.myfund.local:
    <<: *orderer
    container_name: orderer2.orderer.myfund.local
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 8050
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:8053
    ports: ["8050:8050", "8053:8053"]
    volumes:
      - ./organizations/ordererOrganizations/orderer.myfund.local/orderers/orderer2.orderer.myfund.local/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/orderer.myfund.local/orderers/orderer2.orderer.myfund.local/tls:/var/hyperledger/orderer/tls
      - orderer2:/var/hyperledger/production/orderer

  orderer3.orderer.myfund.local:
    <<: *orderer
    container_name: orderer3.orderer.myfund.local
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 9050
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:9053
    ports: ["9050:9050", "9053:9053"]
    volumes:
      - ./organizations/ordererOrganizations/orderer.myfund.local/orderers/orderer3.orderer.myfund.local/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/orderer.myfund.local/orderers/orderer3.orderer.myfund.local/tls:/var/hyperledger/orderer/tls
      - orderer3:/var/hyperledger/production/orderer

  peer0.ministry.myfund.local:
    <<: *peer
    container_name: peer0.ministry.myfund.local
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.ministry.myfund.local
      CORE_PEER_LOCALMSPID: MinistryMSP
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_ADDRESS: peer0.ministry.myfund.local:7051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.ministry.myfund.local:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.ministry.myfund.local:7051
    ports: ["7051:7051"]
    volumes:
      - ./organizations/peerOrganizations/ministry.myfund.local/peers/peer0.ministry.myfund.local/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/ministry.myfund.local/peers/peer0.ministry.myfund.local/tls:/etc/hyperledger/fabric/tls
      - peer0-ministry:/var/hyperledger/production

  peer0.agency.myfund.local:
    <<: *peer
    container_name: peer0.agency.myfund.local
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.agency.myfund.local
      CORE_PEER_LOCALMSPID: AgencyMSP
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_ADDRESS: peer0.agency.myfund.local:9051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.agency.myfund.local:9051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.agency.myfund.local:9051
    ports: ["9051:9051"]
    volumes:
      - ./organizations/peerOrganizations/agency.myfund.local/peers/peer0.agency.myfund.local/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/agency.myfund.local/peers/peer0.agency.myfund.local/tls:/etc/hyperledger/fabric/tls
      - peer0-agency:/var/hyperledger/production

  peer0.auditor.myfund.local:
    <<: *peer
    container_name: peer0.auditor.myfund.local
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.auditor.myfund.local
      CORE_PEER_LOCALMSPID: AuditorMSP
      CORE_PEER_LISTENADDRESS: 0.0.0.0:11051
      CORE_PEER_ADDRESS: peer0.auditor.myfund.local:11051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.auditor.myfund.local:11051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.auditor.myfund.local:11051
    ports: ["11051:11051"]
    volumes:
      - ./organizations/peerOrganizations/auditor.myfund.local/peers/peer0.auditor.myfund.local/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/auditor.myfund.local/peers/peer0.auditor.myfund.local/tls:/etc/hyperledger/fabric/tls
      - peer0-auditor:/var/hyperledger/production

  # fund_cc as a service, one per org: each peer dials its own org's container over TLS.
  # CORE_CHAINCODE_ID_NAME (the package ID) comes from the env file network.sh writes.
  fundcc.ministry.myfund.local:
    <<: *fundcc
    container_name: fundcc.ministry.myfund.local
    env_file: [{ path: channel-artifacts/fundcc-ministry.env, required: false }]
    environment: { <<: *fundcc-env, CORE_PEER_LOCALMSPID: MinistryMSP }
    volumes:
      - ./organizations/peerOrganizations/ministry.myfund.local/peers/fundcc.ministry.myfund.local/tls:/tls:ro

  fundcc.agency.myfund.local:
    <<: *fundcc
    container_name: fundcc.agency.myfund.local
    env_file: [{ path: channel-artifacts/fundcc-agency.env, required: false }]
    environment: { <<: *fundcc-env, CORE_PEER_LOCALMSPID: AgencyMSP }
    volumes:
      - ./organizations/peerOrganizations/agency.myfund.local/peers/fundcc.agency.myfund.local/tls:/tls:ro

  fundcc.auditor.myfund.local:
    <<: *fundcc
    container_name: fundcc.auditor.myfund.local
    env_file: [{ path: channel-artifacts/fundcc-auditor.env, required: false }]
    environment: { <<: *fundcc-env, CORE_PEER_LOCALMSPID: AuditorMSP }
    volumes:
      - ./organizations/peerOrganizations/auditor.myfund.local/peers/fundcc.auditor.myfund.local/tls:/tls:ro

networks:
  fabric:
    name: myfund

volumes:
  orderer1:
  orderer2:
  orderer3:
  peer0-ministry:
  peer0-agency:
  peer0-auditor:
